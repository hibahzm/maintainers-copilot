[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "maintainers-copilot-model-server"
version = "0.1.0"
description = "Inference service for Maintainers Copilot"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "transformers>=4.48",
  "torch>=2.5",
  "spacy>=3.8",
]
