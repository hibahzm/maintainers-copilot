name: maintainers-copilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maintainers-copilot-postgres
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot-dev-only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: maintainers-copilot-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: maintainers-copilot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-dev-only
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  vault:
    image: hashicorp/vault:1.19
    container_name: maintainers-copilot-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-root-token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "${VAULT_PORT:-8200}:8200"

volumes:
  postgres_data:
  minio_data:

# App containers join this file after their Dockerfiles exist:
# api, model-server, chatbot, widget-build, demo-host
