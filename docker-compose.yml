name: maintainers-copilot

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: maintainers-copilot-db
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot-dev-only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maintainers-copilot-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: maintainers-copilot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-dev-only
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.19
    container_name: maintainers-copilot-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_TOKEN:-dev-only-root-token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.19
    container_name: maintainers-copilot-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-dev-only-root-token}"
      VAULT_MOUNT_POINT: "${VAULT_MOUNT_POINT:-secret}"
      VAULT_SECRET_PATH: "${VAULT_SECRET_PATH:-maintainers-copilot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-copilot-dev-only}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin-dev-only}"
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-dev-only-jwt-signing-key}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      TRACING_API_KEY: "${TRACING_API_KEY:-dev-only-tracing-key}"
    volumes:
      - ./docker/vault-init.sh:/vault-init.sh:ro
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: migrate/Dockerfile
    container_name: maintainers-copilot-migrate
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  model-server:
    build:
      context: .
      dockerfile: model_server/Dockerfile
    container_name: maintainers-copilot-model-server
    environment:
      CLASSIFIER_MODEL_DIR: "/app/artifacts/classifier/first-distilbert-freeze4/model"
      CLASSIFIER_EXPECTED_SHA256: "45790f41e45d707aada1b76e87e4b6919e51ea357c40bc1f30a444fe34a6f67a"
      OPENAI_SUMMARIZER_MODEL: "${OPENAI_SUMMARIZER_MODEL:-gpt-4o-mini}"
      OPENAI_RAG_ANSWER_MODEL: "${OPENAI_RAG_ANSWER_MODEL:-gpt-4o-mini}"
      RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-intfloat/e5-small-v2}"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-dev-only-root-token}"
      VAULT_MOUNT_POINT: "${VAULT_MOUNT_POINT:-secret}"
      VAULT_SECRET_PATH: "${VAULT_SECRET_PATH:-maintainers-copilot}"
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "${MODEL_SERVER_PORT:-8001}:8001"
    depends_on:
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: maintainers-copilot-api
    environment:
      MODEL_SERVER_URL: "http://model-server:8001"
      DATABASE_URL: "postgresql://copilot:copilot-dev-only@db:5432/copilot"
      REDIS_URL: "redis://redis:6379/0"
      CONVERSATION_TTL_SECONDS: "${CONVERSATION_TTL_SECONDS:-7200}"
      ACCESS_TOKEN_TTL_MINUTES: "${ACCESS_TOKEN_TTL_MINUTES:-60}"
      CHAT_AGENT_MODEL: "${CHAT_AGENT_MODEL:-gpt-4o-mini}"
      CHAT_AGENT_MAX_TOOL_ROUNDS: "${CHAT_AGENT_MAX_TOOL_ROUNDS:-3}"
      WIDGET_PUBLIC_URL: "${WIDGET_PUBLIC_URL:-http://localhost:4173}"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-dev-only-root-token}"
      VAULT_MOUNT_POINT: "${VAULT_MOUNT_POINT:-secret}"
      VAULT_SECRET_PATH: "${VAULT_SECRET_PATH:-maintainers-copilot}"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      model-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    container_name: maintainers-copilot-chatbot
    environment:
      API_BASE_URL: "http://api:8000"
    ports:
      - "${CHATBOT_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  widget:
    build:
      context: ./widget
      dockerfile: Dockerfile
    container_name: maintainers-copilot-widget
    ports:
      - "${WIDGET_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  host:
    build:
      context: ./demo/host
      dockerfile: Dockerfile
    container_name: maintainers-copilot-host
    ports:
      - "${DEMO_HOST_PORT:-8080}:80"
    depends_on:
      widget:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
