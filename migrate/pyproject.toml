[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "maintainers-copilot-migrate"
version = "0.1.0"
description = "Alembic migration runner for Maintainers Copilot"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]
